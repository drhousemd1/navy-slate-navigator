# Release template, not a remote project selection. The isolated native runtime
# has its own config. Resolve/check this template with scripts/prepare-release.py.
project_id = "obedience"

[auth]
# Unresolved deliberately: no Lovable, localhost or guessed production fallback.
site_url = "env(OBEDIENCE_RELEASE_SITE_URL)"
additional_redirect_urls = [
  "env(OBEDIENCE_RELEASE_AUTH_REDIRECT_URL)",
  "env(OBEDIENCE_RELEASE_RECOVERY_REDIRECT_URL)"
]

# These handlers validate the live USER token with Auth, reject anon/service
# credentials as user identity, and enforce current SQL permissions themselves.
[functions.message-media]
enabled = true
verify_jwt = false
entrypoint = "./functions/message-media/index.ts"

[functions.encyclopedia-admin]
enabled = true
verify_jwt = false
entrypoint = "./functions/encyclopedia-admin/index.ts"

[functions.app-branding]
enabled = true
verify_jwt = false
entrypoint = "./functions/app-branding/index.ts"

# Start checks live Auth. Status/resume use the exact job's secret capability
# after Auth deletion; gateway JWT enforcement would break that recovery path.
[functions.account-deletion]
enabled = true
verify_jwt = false
entrypoint = "./functions/account-deletion/index.ts"

# Public configuration only; no private key is returned. Missing key gives 503.
[functions.get-vapid-public-key]
enabled = true
verify_jwt = false
entrypoint = "./functions/get-vapid-public-key/index.ts"

# Deploy these named tombstones to replace old code; they return 410 and do not
# send notifications, schedule reminders or generate keys.
[functions.send-push-notification]
enabled = true
verify_jwt = false
entrypoint = "./functions/send-push-notification/index.ts"

[functions.send-wellness-reminder]
enabled = true
verify_jwt = false
entrypoint = "./functions/send-wellness-reminder/index.ts"

[functions.generate-vapid-keys]
enabled = true
verify_jwt = false
entrypoint = "./functions/generate-vapid-keys/index.ts"

# Separate reviewed push rollout only. Its own worker secret is not a user JWT.
# This does not stop a previously deployed worker or change delivery_enabled.
[functions.dispatch-notifications]
enabled = false
verify_jwt = false
entrypoint = "./functions/dispatch-notifications/index.ts"

# Inert account-reset tombstone: keep disabled and excluded from this release.
# enabled=false does NOT remove a copy already deployed on a hosted project.
[functions.create-demo-user]
enabled = false
verify_jwt = true
entrypoint = "./functions/create-demo-user/index.ts"
